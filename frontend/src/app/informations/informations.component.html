<mat-form-field appearance="fill">
    <mat-label>Separator :</mat-label>
    <input type="text" matInput [formControl]="separator" placeholder="Ex. ; or ," maxlength="1">
    <mat-error *ngIf="separator.hasError">
        Separator must 1 character
    </mat-error>
</mat-form-field>
<mat-form-field appearance="fill">
    <mat-label>Class Name :</mat-label>
    <input type="text" matInput [formControl]="className" placeholder="Ex. Class.Name">
    <mat-error *ngIf="className.hasError('required')">
        Class Name is <strong>required</strong>
    </mat-error>
    <mat-error *ngIf="className.hasError('pattern')">
        Must have at least a ".", eg : Class.Name
    </mat-error>
</mat-form-field>
