<h1>Csvgen UI</h1>
<div>

<form [formGroup]="myForm" (ngSubmit)="onSubmitted()">
    <app-uploader formGroupName="uploader"></app-uploader>
    <app-informations formGroupName="informations"></app-informations>
    <app-fields formGroupName="fields"></app-fields>
    <p></p>
    <div class="example-button-row">
        <button mat-raised-button color="primary" type="submit">Submit</button>
        <button mat-raised-button type='button' (click)="resetForm()">Reset</button>
    </div>
    
</form>
<app-dialog-spinner class="spinner" *ngIf="progressSpinner"></app-dialog-spinner>
</div>
