<mat-expansion-panel  hideToggle  (opened)="panelOpenState = true"
                                  (closed)="panelOpenState = false">
    <mat-expansion-panel-header>
        <mat-panel-title class="panel-center">
            Columns :
        </mat-panel-title>
        <mat-panel-description>
            <button type='button' mat-button (click)="guessIt()">Guess it !</button>
        </mat-panel-description>
    </mat-expansion-panel-header>
    <form autocomplete="off" [formGroup]="form">
      <ng-container formArrayName="fields" class="panel-center">
        <ng-container *ngFor="let fieldForm of fields.controls; let i = index">
            <div [formGroupName]="i" class="row">
                <mat-form-field appearance="fill">
                    <input matInput color="primary"
                           formControlName="column"
                           placeholder="Column name">
                </mat-form-field>
                <mat-form-field appearance="fill">
                  <input matInput color="primary"
                  formControlName="type"
                  placeholder="Type"
                  [matAutocomplete]="auto">
                  <mat-autocomplete #auto="matAutocomplete">
                    <mat-option *ngFor="let option of filteredOptions[i] | async" [value]="option">
                      {{option}}
                    </mat-option>
                  </mat-autocomplete>
                </mat-form-field>
                <mat-icon (click)="deleteField(i)">
                    delete_forever</mat-icon>
            </div>
        </ng-container>
    </ng-container>
    <button mat-mini-fab color="primary" (click)="addField('','')">
      <mat-icon class="add-course-btn">add</mat-icon>
    </button>
    </form>
</mat-expansion-panel>
